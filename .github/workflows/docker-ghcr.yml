name: docker-ghcr

# 多架构镜像（amd64/arm64）自动构建并发布到 ghcr.io：
#   - push 到 main / 打 v* tag / 手动触发 → 构建并推送
#   - PR 触碰构建相关文件 → 仅构建验证，不推送
# tag 说明：main 推 latest + main + sha-xxxxxx；v1.2.3 推 1.2.3 / 1.2 / 1
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "scripts/**"                      # 门禁脚本住这里：改门禁必须被门禁跑一遍
      - ".harness/**"                     # 规范 / 深度基线（棘轮数据）
      - "*.sh"
      - "config.example.json"
      - ".github/workflows/docker-ghcr.yml"
      - ".github/workflows/gate.yml"      # 两条发布线共用的门禁实现
  workflow_dispatch:

# 并发组：PR 取消过时构建；main/tag 按引用串行——发版时 main+tag 同推不再双跑
# 同一份代码的多架构构建（QEMU arm64 一次不便宜）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # github.repository 自动小写化，得到 ghcr.io/linguo2625469/workbuddy2api-panel
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 治理门禁：与 go-binaries 共用同一份实现（见 .github/workflows/gate.yml）。
  #
  # 为什么镜像线也要门禁：镜像是**可运行产物**——只有二进制线跑门禁，等于留了一条
  # 「改完 scripts/ 或 .harness/ 直接打镜像」的绕过路径。两条线都要，且必须是同一份实现。
  gate:
    uses: ./.github/workflows/gate.yml
    with:
      base_ref: ${{ github.base_ref }}

  build-and-publish:
    # 门禁不过就不构建、不推送镜像（与 go-binaries 的 build 依赖 gate 同语义）。
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU（arm64 交叉模拟）
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 关闭 provenance attestation：避免 ghcr 页面出现 unknown/unknown 架构条目
          provenance: false
