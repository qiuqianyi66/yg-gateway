name: release

# 发布流水线（2026-10-16 由 go-binaries.yml + docker-ghcr.yml **合并**而来）。
#
# 为什么合并（原 D2 待拍板项，用户已拍板「合并」）：两条线各自 `uses: ./.github/workflows/gate.yml`，
# 于是每次 push 门禁跑两遍（重复约 2.5 分钟）。门禁**必须**共用同一份实现（复制成两份必然分叉，
# 分叉后会给「这条线过了、那条线没过」的假保证），所以消除重复的**正确做法是合并成一条
# workflow**——一个 gate job + 两个产物 job——**不是**把 gate 内联回去。
#
# 合并前后等价的是：门禁仍然是两条产物线**共同的前置**（build 与 build-image 都 needs gate），
# 门禁不过就不产出二进制、不打镜像。
#
# 产出：
#   - PR / push main → test（go test/vet/node --check/govulncheck）+ gate + race
#                      + 五平台二进制编译验证（仅存 artifact）
#                      + 多架构镜像构建验证（不推送）
#   - push main      → 额外把多架构镜像推到 ghcr.io
#   - push v* tag    → 上述 + 打包上传 GitHub Release（zip/tar.gz + checksums）+ 推镜像 tag
# 固化的发布纪律（曾两次人祸，见仓库 HANDOFF）：-s -w 剥离、二进制版本串 == 源码
# appVersion、tag 版本 == 源码版本（-ci 后缀的测试 tag 豁免，用于演练发布线）。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    # 两条线原来的 paths 取**并集**：合并后一个流水线负责全部产物，所以任一产物相关文件
    # 变更都要跑一遍。副作用是「只改 Dockerfile」的 PR 现在也会跑 test/race/build（原来只跑
    # 镜像线）——多花的是分钟数，换的是「不会有一条产物线悄悄没被验证」。
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "scripts/**"                      # 门禁脚本住这里：改门禁必须被门禁跑一遍
      - ".harness/**"                     # 规范 / 深度基线（棘轮数据）/ 变更追踪
      - "*.sh"
      - "config.example.json"
      - ".github/workflows/release.yml"
      - ".github/workflows/gate.yml"      # 产物线共用的门禁实现
  workflow_dispatch:

# 并发组：PR 取消过时构建；main/tag 按引用串行——发版时 main+tag 同推不再双跑
# 同一份代码的多架构构建（QEMU arm64 一次不便宜）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # github.repository 自动小写化，得到 ghcr.io/linguo2625469/workbuddy2api-panel
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # ubuntu runner 自带 node → panel 包的 JS 运行时冒烟测试（TestAppJSTopLevelSmoke）会真实执行
      - run: go test ./...
      # 静态检查门禁（与 .harness/skills/main-dev/unit-test-ci 声明对齐）：
      #   go vet 抓常见错误（格式化串、unreachable、锁拷贝等）
      #   node --check 校验 go:embed 的 app.js 语法（Go 编译器不查其内容，语法错会白屏但 go test 全绿）
      - run: go vet ./...
      - name: 前端脚本语法校验（go:embed 单文件）
        run: node --check internal/panel/app.js
      # 依赖漏洞扫描：govulncheck 零告警才过（Go 1.27.2 之前的版本带 9 个 stdlib CVE，
      # go-version-file 已 pin 到 go.mod 的 1.27.2）
      - name: 依赖漏洞扫描（govulncheck）
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  # 治理门禁：实现见 .github/workflows/gate.yml（可复用 workflow）。
  # 为什么抽出去（而不是各写一份）：门禁复制成两份必然分叉，分叉后会给
  # 「这条线过了、那条线没过」的假保证。两条产物线共用**同一份**实现，且都 needs 它。
  gate:
    uses: ./.github/workflows/gate.yml
    with:
      base_ref: ${{ github.base_ref }}

  # 竞态检测：Linux runner 自带 gcc，启用 CGO 跑 -race（Windows 本地开发环境无 gcc，
  # 无法跑 -race，故数据竞争检测放到 CI）。独立 job 与 test 并行，不污染普通测试的
  # CGO_ENABLED=0 口径（普通测试不依赖 cgo，race 需要 cgo 的 race runtime）。
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 竞态检测（-race）
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

  build:
    needs: [test, gate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .zip }
          - { goos: linux, goarch: amd64, ext: .tar.gz }
          - { goos: linux, goarch: arm64, ext: .tar.gz }
          - { goos: darwin, goarch: amd64, ext: .tar.gz }
          - { goos: darwin, goarch: arm64, ext: .tar.gz }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 取源码版本号
        id: ver
        run: echo "v=$(grep -oP 'appVersion = "\K[^"]+' cmd/server/main.go)" >> "$GITHUB_OUTPUT"

      - name: 构建（剥离符号，对齐本地发布口径）
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags "-s -w" -o "yg-gateway${{ matrix.goos == 'windows' && '.exe' || '' }}" ./cmd/server

      # 版本串断言：二进制必须含源码 appVersion（防交叉编译矩阵里编错树/漏 ldflags）
      - name: 断言二进制版本串
        run: |
          BIN="yg-gateway${{ matrix.goos == 'windows' && '.exe' || '' }}"
          if ! grep -qa "${{ steps.ver.outputs.v }}" "$BIN"; then
            echo "::error::binary missing version string ${{ steps.ver.outputs.v }}"
            exit 1
          fi
          echo "version assert OK: ${{ steps.ver.outputs.v }}"

      - name: 打包（windows=zip 三件套，其余=tar.gz）
        run: |
          V="${{ steps.ver.outputs.v }}"
          case "${{ matrix.goos }}" in
            windows)
              NAME="yg-gateway-v${V}-windows-amd64.zip"
              zip -q "$NAME" yg-gateway.exe config.example.json README.md
              ;;
            *)
              NAME="yg-gateway-v${V}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
              tar czf "$NAME" yg-gateway config.example.json README.md
              ;;
          esac
          echo "name=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.name }}
          path: ${{ env.name }}
          retention-days: 7

  # 多架构镜像（amd64/arm64）构建；非 PR 时推送 ghcr.io。
  # 门禁不过就不构建、不推送镜像（与 build 依赖 gate 同语义）。
  build-image:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU（arm64 交叉模拟）
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 关闭 provenance attestation：避免 ghcr 页面出现 unknown/unknown 架构条目
          provenance: false

  # 仅 tag 触发：校验 tag == 源码版本（-ci 演练 tag 豁免）→ 汇总资产 → 建 Release
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 取历史 tag 算 compare 链接
      - name: tag 与源码版本一致性断言
        run: |
          SRC=$(grep -oP 'appVersion = "\K[^"]+' cmd/server/main.go)
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_NAME" != *-ci ]]; then
            if [[ "$TAG" != "$SRC" ]]; then
              echo "::error::tag $GITHUB_REF_NAME 与源码 appVersion=$SRC 不一致（先提交版本号再打 tag）"
              exit 1
            fi
          else
            echo "演练 tag（-ci 后缀）跳过一致性断言：tag=$TAG src=$SRC"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum *.zip *.tar.gz > checksums.txt && ls -la
      - name: 上一版 tag（compare 链接用）
        id: prev
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          echo "prev=${PREV}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            CI 自动构建发布（五平台二进制 + checksums）。

            完整变更：https://github.com/${{ github.repository }}/compare/${{ steps.prev.outputs.prev }}...${{ github.ref_name }}
          files: dist/*
