name: gate

# 可复用 workflow：治理门禁（全仓 gofmt / R10 新增静默忽略 / PowerShell 引号陷阱 / 边界 / 深度棘轮）。
#
# 被发布流水线调用：
#   - release.yml 一次（`gate` job），同时作为五平台二进制 `build` 与多架构镜像 `build-image`
#     的前置（两者都 `needs: gate`）。
# 目的：**任何能产出可运行产物的路径，都必须先过同一道门禁**。
#
# 为什么抽成可复用（而不是每个 workflow 各粘一份）：
#   门禁是最不能被复制的东西——两份实现必然分叉，而分叉后的门禁会给出
#   「这条线过了、那条线没过」的**假保证**；分叉得越久，越没人知道哪份才算数。
#   抽成一份之后，改门禁只改这里，所有调用方同时生效（PR paths 里也包含本文件，
#   保证「改门禁」本身会被门禁跑一遍）。
#
# 历史（2026-10-16 两条发布线合并）：合并前 go-binaries 与 docker-ghcr **各自**调用一次本文件，
# 于是每次 push 门禁跑两遍（重复约 2.5 分钟）。当时的代价说明写的是「若将来要消除重复，正确做法
# 是把两条发布线合并成一个 workflow（一个 gate job + 两个 build job），而不是把 gate 内联回去」——
# 已按这个做法执行（提交 9c68947）：门禁仍只这一份实现，每次 push 只跑一次。
on:
  workflow_call:
    inputs:
      base_ref:
        description: 差分基准分支名（PR 传 github.base_ref；push 留空——门禁自己用事件里的 before SHA；两者都没有则回落 HEAD~1 并告警）
        type: string
        required: false
        default: ""
  workflow_dispatch:

# 最小权限：门禁只读代码（checkout 需要 contents: read）。
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 必须取全历史：R10 与「本次改动」是相对 base 提交算的差分
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 解析 base（PR → origin/<base>；tag push → 上一个**发版** tag；branch push → 事件的 before；否则 HEAD~1 并告警）
        id: base
        env:
          BASE_REF: ${{ inputs.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # 单一写点：所有分支只往 REF 赋值，最后统一写 $GITHUB_OUTPUT 并断言非空。
          # 为什么要断言（复审 🟢）：`-Base ""` 会让 pre-commit 的「改动文件」与 R10 变成
          # 「检查了 0 个文件」**且 exit 0** —— 假绿（L-6 同族）。当前没有路径能产出空 ref，
          # 但「没有护栏」意味着将来任何人加一条 exit 0 时忘写 ref，门禁就会假装查过。
          REF=""

          if [ -n "${BASE_REF:-}" ]; then
            git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            REF="origin/$BASE_REF"
            echo "base = PR 基准 $REF"

          # tag push：GitHub 对「新建 ref」给的 before 是 40 个 0，但基准**是可确定的**——
          # 上一个**发版** tag。必须排除 -ci 演练 tag（release.yml 明确支持「先打 -ci 演练再发版」）：
          # 演练 tag 通常就贴在 HEAD~1，若把它当基准，差分窗口退化成 1 个提交 = 悄悄回到旧的
          # HEAD~1 行为，而日志还写着「全部提交都进入差分」（复审 🟡，实测窗口 1 vs 2）。
          elif printf '%s' "${GIT_REF:-}" | grep -q '^refs/tags/'; then
            PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-ci' "${GIT_REF_NAME}^" 2>/dev/null || true)
            if [ -n "${PREV_TAG:-}" ] && git cat-file -e "${PREV_TAG}^{commit}" 2>/dev/null; then
              REF="$PREV_TAG"
              echo "base = 上一个发版 tag（$REF）：自该 tag 起的提交都进入差分（-ci 演练 tag 不计）"
            else
              REF="HEAD~1"
              echo "::warning::tag push 且找不到上一个发版 tag（首个 tag？）→ 回落 HEAD~1"
            fi

          # branch push：基准是「本次推送之前的 HEAD」。固定用 HEAD~1 的后果：一次推 N>1 个提交时，
          # R10 与「改动文件」只差分了**最后一个**提交，前 N-1 个是盲区
          # （REQ-ci-gate-base F-1，已实测：一次推 6 个提交，CI 只查了其中 1 个）。
          elif [ -n "${BEFORE_SHA:-}" ] && ! printf '%s' "$BEFORE_SHA" | grep -qE '^0+$'; then
            if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              REF="$BEFORE_SHA"
              echo "base = push 事件的 before（$REF）：本次推送的全部提交都进入差分"
            else
              REF="HEAD~1"
              echo "::warning::before SHA $BEFORE_SHA 不在当前历史里（强推/改写历史？）→ 回落 HEAD~1，本次推送的早期提交可能漏检"
            fi
          else
            REF="HEAD~1"
            echo "::warning::事件里没有可用的 before SHA（workflow_dispatch 或新分支首推）→ 回落 HEAD~1，多提交时早期提交可能漏检"
          fi

          if [ -z "${REF:-}" ]; then
            echo "::error::base 解析为空（ref 未赋值）——下游 -Base 空串会把门禁变成「检查 0 个文件」的假绿"
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
      # -Fast：go test 由各 workflow 自己的 test job 独占（check-depth 内部仍会跑一次带覆盖率的，棘轮需要它）
      # -AllFiles：CI 工作区干净，「本次改动的文件」恒为空 → 只查改动等于不查
      # -Base：改动已提交，只有与 base 差分才能看到「本次新增了哪些行」
      - name: 提交前总闸（全仓 gofmt / R10 新增行 / PowerShell 引号陷阱 / 边界 / 深度棘轮）
        env:
          # 走 env 而不是把 ${{ }} 直接拼进 run:（GitHub 官方要求，复审 🟢）：ref 的取值可能是
          # tag 名，而 git 允许 ref 含 `$ ( ) ;` —— 双引号内的 `$()` 会被 bash 当命令替换执行。
          # 下面用 `$BASE_REF_RESOLVED`（bash 展开环境变量）而**不是** `$env:...`（那是 PowerShell 语法）。
          BASE_REF_RESOLVED: ${{ steps.base.outputs.ref }}
        run: pwsh -NoProfile -File scripts/pre-commit.ps1 -Fast -AllFiles -Base "$BASE_REF_RESOLVED"
