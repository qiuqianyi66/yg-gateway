name: go-binaries

# 可运行二进制构建/发布：
#   - PR / push main → 测试 + 五平台编译验证（产物仅存 artifact，不发布）
#   - push v* tag    → 同上 + 打包上传到 GitHub Release（zip/tar.gz + checksums）
# 固化的发布纪律（曾两次人祸，见仓库 HANDOFF）：-s -w 剥离、二进制版本串 == 源码
# appVersion、tag 版本 == 源码版本（-ci 后缀的测试 tag 豁免，用于演练发布线）。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "scripts/**"                      # 门禁脚本住在 scripts/：改门禁本身必须被门禁跑一遍
      - ".harness/**"                     # 规范 / 深度基线（棘轮数据）/ 变更追踪
      - "config.example.json"
      - ".github/workflows/go-binaries.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # ubuntu runner 自带 node → panel 包的 JS 运行时冒烟测试（TestAppJSTopLevelSmoke）会真实执行
      - run: go test ./...
      # 静态检查门禁（与 .harness/skills/main-dev/unit-test-ci 声明对齐）：
      #   go vet 抓常见错误（格式化串、unreachable、锁拷贝等）
      #   node --check 校验 go:embed 的 app.js 语法（Go 编译器不查其内容，语法错会白屏但 go test 全绿）
      - run: go vet ./...
      - name: 前端脚本语法校验（go:embed 单文件）
        run: node --check internal/panel/app.js
      # 依赖漏洞扫描：govulncheck 零告警才过（Go 1.27.2 之前的版本带 9 个 stdlib CVE，
      # go-version-file 已 pin 到 go.mod 的 1.27.2）
      - name: 依赖漏洞扫描（govulncheck）
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  # 治理门禁：把 .harness/rules/ 的规范变成 CI 的退出码（脚本本体在 scripts/）。
  # 与 test job 的分工：test 管功能（go test / go vet / node --check / govulncheck），
  # gate 管治理（全仓 gofmt、依赖边界、深度棘轮、R10 新增静默忽略点），两者并行。
  # 为什么不能只靠本地 pre-commit：--no-verify、忘记跑、或别的会话直接 push 都会绕过。
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 必须取全历史：R10 与「本次改动」是相对 base 提交算的差分
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 解析 base（PR → origin/<base>；push → HEAD~1）
        id: base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            echo "ref=origin/$BASE_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi
      # -Fast：go test 由 test job 独占（check-depth 内部仍会跑一次带覆盖率的，棘轮需要它）
      # -AllFiles：CI 工作区干净，「本次改动的文件」恒为空 → 只查改动等于不查
      # -Base：改动已提交，只有与 base 差分才能看到「本次新增了哪些行」
      - name: 提交前总闸（全仓 gofmt / R10 新增行 / 边界 / 深度棘轮）
        run: pwsh -NoProfile -File scripts/pre-commit.ps1 -Fast -AllFiles -Base "${{ steps.base.outputs.ref }}"

  # 竞态检测：Linux runner 自带 gcc，启用 CGO 跑 -race（Windows 本地开发环境无 gcc，
  # 无法跑 -race，故数据竞争检测放到 CI）。独立 job 与 test 并行，不污染普通测试的
  # CGO_ENABLED=0 口径（普通测试不依赖 cgo，race 需要 cgo 的 race runtime）。
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 竞态检测（-race）
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

  build:
    needs: [test, gate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .zip }
          - { goos: linux, goarch: amd64, ext: .tar.gz }
          - { goos: linux, goarch: arm64, ext: .tar.gz }
          - { goos: darwin, goarch: amd64, ext: .tar.gz }
          - { goos: darwin, goarch: arm64, ext: .tar.gz }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 取源码版本号
        id: ver
        run: echo "v=$(grep -oP 'appVersion = "\K[^"]+' cmd/server/main.go)" >> "$GITHUB_OUTPUT"

      - name: 构建（剥离符号，对齐本地发布口径）
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags "-s -w" -o "yg-gateway${{ matrix.goos == 'windows' && '.exe' || '' }}" ./cmd/server

      # 版本串断言：二进制必须含源码 appVersion（防交叉编译矩阵里编错树/漏 ldflags）
      - name: 断言二进制版本串
        run: |
          BIN="yg-gateway${{ matrix.goos == 'windows' && '.exe' || '' }}"
          if ! grep -qa "${{ steps.ver.outputs.v }}" "$BIN"; then
            echo "::error::binary missing version string ${{ steps.ver.outputs.v }}"
            exit 1
          fi
          echo "version assert OK: ${{ steps.ver.outputs.v }}"

      - name: 打包（windows=zip 三件套，其余=tar.gz）
        run: |
          V="${{ steps.ver.outputs.v }}"
          case "${{ matrix.goos }}" in
            windows)
              NAME="yg-gateway-v${V}-windows-amd64.zip"
              zip -q "$NAME" yg-gateway.exe config.example.json README.md
              ;;
            *)
              NAME="yg-gateway-v${V}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
              tar czf "$NAME" yg-gateway config.example.json README.md
              ;;
          esac
          echo "name=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.name }}
          path: ${{ env.name }}
          retention-days: 7

  # 仅 tag 触发：校验 tag == 源码版本（-ci 演练 tag 豁免）→ 汇总资产 → 建 Release
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 取历史 tag 算 compare 链接
      - name: tag 与源码版本一致性断言
        run: |
          SRC=$(grep -oP 'appVersion = "\K[^"]+' cmd/server/main.go)
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_NAME" != *-ci ]]; then
            if [[ "$TAG" != "$SRC" ]]; then
              echo "::error::tag $GITHUB_REF_NAME 与源码 appVersion=$SRC 不一致（先提交版本号再打 tag）"
              exit 1
            fi
          else
            echo "演练 tag（-ci 后缀）跳过一致性断言：tag=$TAG src=$SRC"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum *.zip *.tar.gz > checksums.txt && ls -la
      - name: 上一版 tag（compare 链接用）
        id: prev
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          echo "prev=${PREV}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            CI 自动构建发布（五平台二进制 + checksums）。

            完整变更：https://github.com/${{ github.repository }}/compare/${{ steps.prev.outputs.prev }}...${{ github.ref_name }}
          files: dist/*
